name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alo_field_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (fail on warnings/errors)
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded
